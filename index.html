<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshers' 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #07111f;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f1d99a;
}

.opening {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.f {
    width: 120px;
    height: 120px;

    border: 1px solid #d8b46a;
    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Georgia, serif;
    font-size: 100px;

    animation:
        appear 1.2s ease,
        bloom 2.8s ease 1.2s forwards;
}

.ring {
    position: absolute;

    width: 120px;
    height: 120px;

    border: 1px solid rgba(216,180,106,.7);
    border-radius: 50%;

    animation: ring 2.8s ease 1.2s forwards;
}

.ring:nth-child(2) {
    animation-delay: 1.4s;
}

.ring:nth-child(3) {
    animation-delay: 1.6s;
}

.text {
    position: absolute;
    bottom: 20%;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;

    opacity: 0;

    animation: textIn 1s ease .8s forwards;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.3);
        filter: blur(15px);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

@keyframes bloom {
    0% {
        transform: scale(1);
        opacity: 1;
    }

    30% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(35);
        opacity: 0;
        filter: blur(12px);
    }
}

@keyframes ring {
    0% {
        opacity: 0;
        transform: scale(1);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: scale(25);
    }
}

@keyframes textIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="opening">

    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>

    <div class="f">
        S
    </div>

    <div class="text">
        SERENOVA
    </div>

</div>

<script>

setTimeout(() => {

    window.location.href = "invitation.html";

}, 4000);

</script>

</body>
</html>
