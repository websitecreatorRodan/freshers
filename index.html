<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050505"
>

<meta
    name="color-scheme"
    content="dark"
>

<title>Narayana — Opening</title>


<style>

/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(211, 166, 74, 0.09) 0%,
            rgba(0, 0, 0, 0) 38%
        ),
        #050505;

    color: #d8b35c;

    font-family:
        "Montserrat",
        "Segoe UI",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
}


/* =========================================================
   STARTUP SCREEN
========================================================= */

.startup {

    position: fixed;

    inset: 0;

    display: grid;

    place-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            rgba(201, 157, 67, 0.08),
            transparent 52%
        ),
        linear-gradient(
            180deg,
            #030303 0%,
            #070707 50%,
            #020202 100%
        );

    isolation: isolate;
}


/* =========================================================
   AMBIENT GOLD LIGHT
========================================================= */

.ambient-light {

    position: absolute;

    width: min(85vw, 850px);
    height: min(85vw, 850px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(225, 183, 92, 0.085) 0%,
            rgba(225, 183, 92, 0.025) 35%,
            transparent 72%
        );

    filter: blur(20px);

    opacity: 0;

    animation:
        ambientAppear 1.5s ease forwards,
        ambientPulse 5s ease-in-out 1.5s infinite;

    pointer-events: none;
}


@keyframes ambientAppear {

    from {
        opacity: 0;
        transform: scale(0.65);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


@keyframes ambientPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}


/* =========================================================
   LOGO STAGE
========================================================= */

.logo-stage {

    position: relative;

    width: min(88vw, 780px);

    aspect-ratio: 1 / 1;

    display: grid;

    place-items: center;

    z-index: 5;

    perspective: 1200px;
}


/* =========================================================
   GLOWING BUBBLE
========================================================= */

.logo-bubble {

    position: absolute;

    width: 23%;

    aspect-ratio: 1;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255, 246, 202, 0.95),
            rgba(236, 193, 92, 0.92) 17%,
            rgba(180, 127, 37, 0.82) 40%,
            rgba(92, 59, 16, 0.72) 63%,
            transparent 74%
        );

    box-shadow:
        0 0 20px rgba(221, 177, 75, 0.75),
        0 0 60px rgba(221, 177, 75, 0.38),
        0 0 130px rgba(221, 177, 75, 0.18);

    transform: scale(0.05);

    opacity: 0;

    filter: blur(0.1px);

    animation:
        bubbleAppear
        0.75s
        cubic-bezier(.17,.89,.32,1.35)
        forwards;
}


.logo-bubble::before {

    content: "";

    position: absolute;

    inset: 8%;

    border-radius: inherit;

    border: 1px solid rgba(255,255,255,0.38);

    opacity: 0.65;
}


.logo-bubble::after {

    content: "";

    position: absolute;

    width: 22%;
    height: 22%;

    top: 17%;
    left: 20%;

    border-radius: 50%;

    background: rgba(255,255,255,0.65);

    filter: blur(3px);
}


@keyframes bubbleAppear {

    0% {

        opacity: 0;

        transform:
            scale(0.02)
            translateZ(-300px);
    }

    45% {

        opacity: 1;

        transform:
            scale(1.22)
            translateZ(0);
    }

    70% {

        transform:
            scale(0.92);
    }

    100% {

        opacity: 0;

        transform:
            scale(1.8);
    }
}


/* =========================================================
   MAIN LOGO
========================================================= */

.logo {

    width: 100%;
    height: 100%;

    overflow: visible;

    transform:
        scale(0.32)
        translateY(30px);

    opacity: 0;

    filter:
        drop-shadow(
            0 0 6px
            rgba(222,174,70,0.1)
        );

    animation:
        logoReveal
        1.25s
        cubic-bezier(.16,1,.3,1)
        0.34s
        forwards;

    transform-origin: center;
}


@keyframes logoReveal {

    0% {

        opacity: 0;

        transform:
            scale(0.28)
            translateY(40px);

        filter:
            blur(14px)
            drop-shadow(
                0 0 0
                rgba(0,0,0,0)
            );
    }

    45% {

        opacity: 1;

        transform:
            scale(1.08)
            translateY(-4px);

        filter:
            blur(1px)
            drop-shadow(
                0 0 26px
                rgba(218,174,73,0.30)
            );
    }

    70% {

        transform:
            scale(0.97)
            translateY(2px);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

        filter:
            blur(0)
            drop-shadow(
                0 0 16px
                rgba(218,174,73,0.18)
            );
    }
}


/* =========================================================
   GOLD GRADIENTS
========================================================= */

.gold {

    fill: url(#goldGradient);
}


.gold-stroke {

    stroke: url(#goldStrokeGradient);
}


/* =========================================================
   TOP ARC TEXT
========================================================= */

.arc-text {

    fill: #e1bc67;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 27px;

    font-weight: 600;

    letter-spacing: 5px;

    text-anchor: middle;
}


/* =========================================================
   BOTTOM TEXT
========================================================= */

.bottom-text {

    fill: #d8b35d;

    font-family:
        "Montserrat",
        "Segoe UI",
        sans-serif;

    font-size: 22px;

    font-weight: 500;

    letter-spacing: 3.5px;

    text-anchor: middle;
}


.bottom-text-strong {

    font-weight: 800;
}


/* =========================================================
   LARGE N
========================================================= */

.n-letter {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 285px;

    font-weight: 900;

    fill: url(#orangeGold);

    stroke: rgba(112, 70, 15, 0.35);

    stroke-width: 1.5;

    paint-order: stroke;
}


/* =========================================================
   LOGO COMPONENTS
========================================================= */

.logo-part {

    transform-box: fill-box;

    transform-origin: center;

    opacity: 0;

    animation:
        partAssemble
        0.95s
        cubic-bezier(.17,.89,.32,1.25)
        forwards;
}


.part-1 {
    animation-delay: 0.42s;
}


.part-2 {
    animation-delay: 0.50s;
}


.part-3 {
    animation-delay: 0.58s;
}


.part-4 {
    animation-delay: 0.65s;
}


.part-5 {
    animation-delay: 0.72s;
}


.part-6 {
    animation-delay: 0.79s;
}


.part-7 {
    animation-delay: 0.88s;
}


.part-8 {
    animation-delay: 0.96s;
}


.part-9 {
    animation-delay: 1.04s;
}


@keyframes partAssemble {

    0% {

        opacity: 0;

        transform:
            translate(
                var(--sx, 0px),
                var(--sy, 0px)
            )
            rotate(
                var(--sr, 0deg)
            )
            scale(0.2);
    }

    55% {

        opacity: 1;

        transform:
            translate(
                calc(var(--sx, 0px) * 0.15),
                calc(var(--sy, 0px) * 0.15)
            )
            rotate(
                calc(var(--sr, 0deg) * 0.2)
            )
            scale(1.05);
    }

    100% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0)
            scale(1);
    }
}


/* =========================================================
   STARS
========================================================= */

.star {

    fill: #dfb660;

    filter:
        drop-shadow(
            0 0 5px
            rgba(222,178,84,0.45)
        );

    transform-box: fill-box;

    transform-origin: center;

    animation:
        starAppear
        0.7s
        ease
        forwards;
}


@keyframes starAppear {

    from {

        opacity: 0;

        transform:
            scale(0)
            rotate(-90deg);
    }

    to {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


/* =========================================================
   DISMANTLING
========================================================= */

.logo.dismantle .logo-part:nth-child(1) {

    animation:
        dismantleLeftTop
        1.15s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .logo-part:nth-child(2) {

    animation:
        dismantleLeftBottom
        1.15s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .logo-part:nth-child(3) {

    animation:
        dismantleTop
        1.10s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .logo-part:nth-child(4) {

    animation:
        dismantleRightTop
        1.15s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .logo-part:nth-child(5) {

    animation:
        dismantleRightBottom
        1.15s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .logo-part:nth-child(6) {

    animation:
        dismantleStars
        1.15s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .logo-part:nth-child(7) {

    animation:
        dismantleN
        1.10s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .logo-part:nth-child(8) {

    animation:
        dismantleBook
        1.25s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .logo-part:nth-child(9) {

    animation:
        dismantleText
        1.30s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


/* =========================================================
   CONTROLLED DISMANTLE
========================================================= */

@keyframes dismantleLeftTop {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0);
    }

    100% {

        opacity: 0;

        transform:
            translate(-150px,-65px)
            rotate(-13deg);
    }
}


@keyframes dismantleLeftBottom {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0);
    }

    100% {

        opacity: 0;

        transform:
            translate(-120px,95px)
            rotate(-9deg);
    }
}


@keyframes dismantleTop {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0);
    }

    100% {

        opacity: 0;

        transform:
            translate(0,-125px)
            rotate(5deg);
    }
}


@keyframes dismantleRightTop {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0);
    }

    100% {

        opacity: 0;

        transform:
            translate(150px,-70px)
            rotate(13deg);
    }
}


@keyframes dismantleRightBottom {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0);
    }

    100% {

        opacity: 0;

        transform:
            translate(145px,90px)
            rotate(11deg);
    }
}


/* =========================================================
   STARS DISMANTLE
========================================================= */

@keyframes dismantleStars {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0)
            scale(1);
    }

    30% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0)
            scale(1.03);
    }

    100% {

        opacity: 0;

        transform:
            translate(0,0)
            rotate(0)
            scale(0.85);
    }
}


.logo.dismantle .part-6 .star:nth-child(1) {

    animation:
        starDismantleLeft1
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(2) {

    animation:
        starDismantleLeft2
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.04s
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(3) {

    animation:
        starDismantleLeft3
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.08s
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(4) {

    animation:
        starDismantleLeft4
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.12s
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(5) {

    animation:
        starDismantleLeft5
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.16s
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(6) {

    animation:
        starDismantleRight1
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.04s
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(7) {

    animation:
        starDismantleRight2
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.08s
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(8) {

    animation:
        starDismantleRight3
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.12s
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(9) {

    animation:
        starDismantleRight4
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.16s
        forwards;
}


.logo.dismantle .part-6 .star:nth-child(10) {

    animation:
        starDismantleRight5
        1.05s
        cubic-bezier(.55,.05,.68,.19)
        0.20s
        forwards;
}


@keyframes starDismantleLeft1 {

    to {
        opacity: 0;
        transform:
            translate(-130px,-100px)
            rotate(-45deg)
            scale(.4);
    }
}


@keyframes starDismantleLeft2 {

    to {
        opacity: 0;
        transform:
            translate(-160px,-50px)
            rotate(-35deg)
            scale(.35);
    }
}


@keyframes starDismantleLeft3 {

    to {
        opacity: 0;
        transform:
            translate(-175px,0)
            rotate(-20deg)
            scale(.3);
    }
}


@keyframes starDismantleLeft4 {

    to {
        opacity: 0;
        transform:
            translate(-160px,55px)
            rotate(25deg)
            scale(.35);
    }
}


@keyframes starDismantleLeft5 {

    to {
        opacity: 0;
        transform:
            translate(-125px,105px)
            rotate(40deg)
            scale(.4);
    }
}


@keyframes starDismantleRight1 {

    to {
        opacity: 0;
        transform:
            translate(130px,-100px)
            rotate(45deg)
            scale(.4);
    }
}


@keyframes starDismantleRight2 {

    to {
        opacity: 0;
        transform:
            translate(160px,-50px)
            rotate(35deg)
            scale(.35);
    }
}


@keyframes starDismantleRight3 {

    to {
        opacity: 0;
        transform:
            translate(175px,0)
            rotate(20deg)
            scale(.3);
    }
}


@keyframes starDismantleRight4 {

    to {
        opacity: 0;
        transform:
            translate(160px,55px)
            rotate(-25deg)
            scale(.35);
    }
}


@keyframes starDismantleRight5 {

    to {
        opacity: 0;
        transform:
            translate(125px,105px)
            rotate(-40deg)
            scale(.4);
    }
}


/* =========================================================
   N DISMANTLE
========================================================= */

@keyframes dismantleN {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(0,-18px)
            scale(0.84);
    }
}


/* =========================================================
   BOOK DISMANTLE
========================================================= */

@keyframes dismantleBook {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(-10px,125px)
            scale(0.88);
    }
}


/* =========================================================
   TEXT DISMANTLE
========================================================= */

@keyframes dismantleText {

    0% {

        opacity: 1;

        transform:
            translate(0,0);
    }

    100% {

        opacity: 0;

        transform:
            translate(0,155px);
    }
}


/* =========================================================
   SHIMMER
========================================================= */

.logo-shimmer {

    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    opacity: 0;

    animation:
        shimmerAppear
        1.6s
        ease
        1.15s
        forwards;
}


.logo-shimmer::before {

    content: "";

    position: absolute;

    top: -20%;
    left: -60%;

    width: 35%;
    height: 140%;

    transform: rotate(20deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.17),
            transparent
        );

    filter: blur(3px);

    animation:
        shimmerSweep
        1.35s
        ease-in-out
        1.2s
        forwards;
}


@keyframes shimmerAppear {

    to {
        opacity: 1;
    }
}


@keyframes shimmerSweep {

    from {
        left: -60%;
    }

    to {
        left: 125%;
    }
}


/* =========================================================
   CAPTION
========================================================= */

.startup-caption {

    position: absolute;

    left: 50%;

    bottom:
        max(
            24px,
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%)
        translateY(12px);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color:
        rgba(218,180,92,0.48);

    white-space: nowrap;

    opacity: 0;

    animation:
        captionIn
        1s
        ease
        1.45s
        forwards;
}


@keyframes captionIn {

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .logo-stage {

        width:
            min(
                94vw,
                560px
            );
    }


    .arc-text {

        font-size: 26px;

        letter-spacing: 3px;
    }


    .bottom-text {

        font-size: 20px;

        letter-spacing: 2.5px;
    }


    .n-letter {

        font-size: 270px;
    }


    @keyframes starDismantleLeft1 {

        to {
            opacity: 0;
            transform:
                translate(-95px,-75px)
                rotate(-45deg)
                scale(.4);
        }
    }


    @keyframes starDismantleLeft2 {

        to {
            opacity: 0;
            transform:
                translate(-115px,-38px)
                rotate(-35deg)
                scale(.35);
        }
    }


    @keyframes starDismantleLeft3 {

        to {
            opacity: 0;
            transform:
                translate(-125px,0)
                rotate(-20deg)
                scale(.3);
        }
    }


    @keyframes starDismantleLeft4 {

        to {
            opacity: 0;
            transform:
                translate(-115px,38px)
                rotate(25deg)
                scale(.35);
        }
    }


    @keyframes starDismantleLeft5 {

        to {
            opacity: 0;
            transform:
                translate(-95px,75px)
                rotate(40deg)
                scale(.4);
        }
    }


    @keyframes starDismantleRight1 {

        to {
            opacity: 0;
            transform:
                translate(95px,-75px)
                rotate(45deg)
                scale(.4);
        }
    }


    @keyframes starDismantleRight2 {

        to {
            opacity: 0;
            transform:
                translate(115px,-38px)
                rotate(35deg)
                scale(.35);
        }
    }


    @keyframes starDismantleRight3 {

        to {
            opacity: 0;
            transform:
                translate(125px,0)
                rotate(20deg)
                scale(.3);
        }
    }


    @keyframes starDismantleRight4 {

        to {
            opacity: 0;
            transform:
                translate(115px,38px)
                rotate(-25deg)
                scale(.35);
        }
    }


    @keyframes starDismantleRight5 {

        to {
            opacity: 0;
            transform:
                translate(95px,75px)
                rotate(-40deg)
                scale(.4);
        }
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .logo-stage {

        width: 96vw;
    }


    .arc-text {

        font-size: 23px;

        letter-spacing: 2.3px;
    }


    .bottom-text {

        font-size: 18px;
    }


    .n-letter {

        font-size: 250px;
    }


    .startup-caption {

        font-size: 8px;

        letter-spacing: 3px;
    }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (max-height: 520px) {

    .logo-stage {

        height: 94vh;

        width: 94vh;

        max-width: 760px;
    }


    .startup-caption {

        display: none;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;
    }
}

</style>

</head>


<body>


<!-- =========================================================
     STARTUP
========================================================= -->

<div
    class="startup"
    id="startup"
>


    <!-- =====================================================
         AMBIENT LIGHT
    ====================================================== -->

    <div class="ambient-light"></div>


    <!-- =====================================================
         LOGO STAGE
    ====================================================== -->

    <div class="logo-stage">


        <!-- =================================================
             GOLD BUBBLE
        ================================================== -->

        <div class="logo-bubble"></div>


        <!-- =================================================
             SVG LOGO

<script>

/* =========================================================
   STARTUP ANIMATION CONTROLLER
========================================================= */

(() => {


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const logo =
        document.getElementById(
            "narayanaLogo"
        );


    const startup =
        document.getElementById(
            "startup"
        );


    /* =====================================================
       TIMELINE
       
       0.00s  → bubble appears
       0.34s  → logo begins emerging
       1.40s  → logo assembled
       2.90s  → dismantling begins
       4.30s  → invitation.html
    ===================================================== */

    const DISMANTLE_TIME =
        2900;


    const NAVIGATION_TIME =
        4300;


    /* =====================================================
       START DISMANTLING
    ===================================================== */

    window.setTimeout(() => {

        if (!logo) return;

        logo.classList.add(
            "dismantle"
        );

    }, DISMANTLE_TIME);


    /* =====================================================
       NAVIGATE TO EXISTING WEBSITE
    ===================================================== */

    window.setTimeout(() => {

        window.location.href =
            "invitation.html";

    }, NAVIGATION_TIME);


    /* =====================================================
       CLICK / TAP TO SKIP
    ===================================================== */

    startup.addEventListener(
        "click",
        () => {

            logo.classList.add(
                "dismantle"
            );


            window.setTimeout(
                () => {

                    window.location.href =
                        "invitation.html";

                },
                700
            );

        },
        {
            once: true
        }
    );


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    const reducedMotion =
        window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        );


    if (
        reducedMotion.matches
    ) {

        window.setTimeout(
            () => {

                window.location.href =
                    "invitation.html";

            },
            900
        );

    }


})();

</script>
